name: Deploy to GitHub Pages

on:
  # 推送 main 分支时自动部署（Auto Deploy）
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate screen-data.json
        run: |
          test -f screen-data.json && echo "screen-data.json 存在" || (echo "缺少 screen-data.json" && exit 1)
          node -e "JSON.parse(require('fs').readFileSync('screen-data.json','utf8')); console.log('JSON 校验通过')"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
